name: Publish policy-gate image

# Builds and pushes ghcr.io/<owner>/policy-gate on every change to policy/.
# Without this, the composite action (.github/actions/policy-gate) keeps
# pulling whatever was last manually pushed -- a stale image silently
# rejects new CLI flags instead of surfacing "this image is out of date",
# which looks exactly like a gate bug from the consuming repo's side.

on:
  push:
    branches: [main]
    paths:
      - "policy/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image owner
        id: owner
        run: echo "lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./policy
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/policy-gate:latest
            ghcr.io/${{ steps.owner.outputs.lower }}/policy-gate:${{ github.sha }}
